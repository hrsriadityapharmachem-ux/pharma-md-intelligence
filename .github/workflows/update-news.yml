name: Update Pharma News
run-name: "Refresh and validate live pharma intelligence · Engine 3.11.2"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/update-news.yml"]
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
concurrency:
  group: sri-aditya-pharma-news-refresh
  cancel-in-progress: false
jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Checkout live dashboard branch
        uses: actions/checkout@v4
        with:
          ref: v2-intelligence

      - name: Determine whether a refresh is due (India time)
        id: refresh_window
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "run_refresh=true" >> "$GITHUB_OUTPUT"
            echo "Manual or workflow update trigger: running immediately."
            exit 0
          fi

          HOUR=$(TZ=Asia/Kolkata date +%H)
          if [ "$HOUR" -ge 7 ] && [ "$HOUR" -le 10 ]; then
            echo "run_refresh=true" >> "$GITHUB_OUTPUT"
            echo "India time hour $HOUR: morning 10-minute refresh window."
            exit 0
          fi

          # Outside the morning window, run when the last successful collection
          # is at least 55 minutes old. This avoids relying on a narrow minute
          # window that can be missed when GitHub delays a scheduled event.
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          due = True
          reason = "No valid previous success timestamp; running a recovery refresh."
          try:
              status = json.loads(Path("pipeline_status.json").read_text(encoding="utf-8"))
              stamp = status.get("last_success_at")
              if not stamp:
                  raise ValueError("last_success_at missing")
              last = datetime.fromisoformat(stamp.replace("Z", "+00:00"))
              if last.tzinfo is None:
                  raise ValueError("last_success_at has no timezone")
              age_minutes = (datetime.now(timezone.utc) - last.astimezone(timezone.utc)).total_seconds() / 60
              due = age_minutes >= 55
              reason = f"Last successful collection was {age_minutes:.1f} minutes ago."
          except Exception as exc:
              reason = f"Could not read previous pipeline success ({exc}); running a recovery refresh."

          print(f"run_refresh={'true' if due else 'false'}")
          print(f"reason={reason}")
          PY

      - name: Setup Python
        if: steps.refresh_window.outputs.run_refresh == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Compile-check intelligence engine and validator
        if: steps.refresh_window.outputs.run_refresh == 'true'
        run: |
          python -m py_compile news.py validate_data.py
          python -c "import news; assert news.ENGINE_VERSION == '3.11.2', news.ENGINE_VERSION"

      - name: Collect latest pharma news
        if: steps.refresh_window.outputs.run_refresh == 'true'
        run: |
          set -o pipefail
          python news.py 2>&1 | tee collector.log

      - name: Validate intelligence data
        if: steps.refresh_window.outputs.run_refresh == 'true'
        run: python validate_data.py

      - name: Record successful pipeline health
        if: steps.refresh_window.outputs.run_refresh == 'true' && success()
        run: |
          python - <<'PY'
          import json, re, os
          from datetime import datetime, timezone
          from pathlib import Path
          log = Path('collector.log').read_text(errors='replace')
          feeds = re.findall(r'Successful feeds: (\d+)', log)
          failed = re.findall(r'Failed feeds: (\d+)', log)
          eligible = re.findall(r'Eligible articles: (\d+)', log)
          data = json.loads(Path('data.json').read_text())
          successful_count = int(feeds[-1]) if feeds else data.get('successful_feeds',0)
          failed_count = int(failed[-1]) if failed else data.get('failed_feeds',0)
          partial = failed_count > 0
          result = {'status':'partial' if partial else 'success','last_attempt_at':datetime.now(timezone.utc).isoformat(),'last_success_at':datetime.now(timezone.utc).isoformat(),'last_content_update_at':data.get('updated'),'successful_feeds':successful_count,'failed_feeds':failed_count,'eligible_articles_seen':int(eligible[-1]) if eligible else 0,'published_article_count':data.get('article_count',0),'message':f'Collection and validation passed with {failed_count} failed feed(s).' if partial else 'All feeds collected and validation passed.','workflow_run':os.environ['GITHUB_SERVER_URL']+'/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']}
          if 'Keeping the existing data.json unchanged' in log: result['message']='Feeds checked; no new eligible articles. Existing content retained.'
          Path('pipeline_status.json').write_text(json.dumps(result,indent=2)+'\n')
          PY

      - name: Publish data and monitoring status
        if: steps.refresh_window.outputs.run_refresh == 'true' && success()
        run: |
          git config user.name "Pharma Intelligence Bot"
          git config user.email "actions@github.com"
          git add data.json pipeline_status.json
          git diff --cached --quiet || git commit -m "Refresh pharma intelligence and pipeline status"
          git push origin HEAD:v2-intelligence

      - name: Record failed pipeline health
        if: failure() && steps.refresh_window.outputs.run_refresh == 'true'
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path('pipeline_status.json'); old=json.loads(p.read_text()) if p.exists() else {}
          d=json.loads(Path('data.json').read_text()) if Path('data.json').exists() else {}
          result={'status':'failure','last_attempt_at':datetime.now(timezone.utc).isoformat(),'last_success_at':old.get('last_success_at'),'last_content_update_at':d.get('updated') or old.get('last_content_update_at'),'successful_feeds':old.get('successful_feeds',0),'failed_feeds':old.get('failed_feeds',0),'published_article_count':d.get('article_count',0),'message':'Collection or validation failed. Last-known-good content retained where possible.','workflow_run':os.environ['GITHUB_SERVER_URL']+'/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']}
          p.write_text(json.dumps(result,indent=2)+'\n')
          PY
          git config user.name "Pharma Intelligence Bot"
          git config user.email "actions@github.com"
          git add pipeline_status.json
          git diff --cached --quiet || git commit -m "Record pharma intelligence pipeline failure"
          git push origin HEAD:v2-intelligence

name: Update Pharma News

on:
  workflow_dispatch:

  schedule:
    - cron: "0 * * * *"
      timezone: "Asia/Kolkata"

jobs:

  update-news:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Collect latest pharma news
        run: |
          python news.py

      - name: Save updated news
        run: |
          git config --global user.name "Pharma Intelligence Bot"
          git config --global user.email "actions@github.com"

          git add data.json

          git diff --cached --quiet || git commit -m "Update pharma intelligence"

          git push

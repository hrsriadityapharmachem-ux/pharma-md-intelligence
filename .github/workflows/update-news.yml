name: Update Pharma News

on:
  workflow_dispatch:

  schedule:
    - cron: "0 * * * *"
      timezone: "Asia/Kolkata"

jobs:

  update-news:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout live dashboard branch
        uses: actions/checkout@v4
        with:
          ref: v2-intelligence

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Collect latest pharma news
        run: python news.py

      - name: Validate intelligence data
        run: python validate_data.py

      - name: Save updated news
        run: |
          git config user.name "Pharma Intelligence Bot"
          git config user.email "actions@github.com"

          git add data.json

          git diff --cached --quiet || git commit -m "Update pharma intelligence"

          git push origin HEAD:v2-intelligence

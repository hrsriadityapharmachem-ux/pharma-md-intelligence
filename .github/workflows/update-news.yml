name: Update Pharma News
run-name: "Refresh and validate live pharma intelligence"

on:
  workflow_dispatch:

  # Validate workflow edits immediately against the live branch. The job
  # writes generated data only to v2-intelligence, so it does not retrigger this main-branch path.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-news.yml"

  schedule:
    - cron: "0 * * * *"
      timezone: "Asia/Kolkata"

concurrency:
  group: sri-aditya-pharma-news-refresh
  cancel-in-progress: false

jobs:

  update-news:

    runs-on: ubuntu-latest
    timeout-minutes: 40

    permissions:
      contents: write

    steps:

      - name: Checkout live dashboard branch
        uses: actions/checkout@v4
        with:
          ref: v2-intelligence

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Collect latest pharma news
        run: python news.py

      - name: Validate intelligence data
        run: python validate_data.py

      - name: Save updated news
        run: |
          git config user.name "Pharma Intelligence Bot"
          git config user.email "actions@github.com"

          git add data.json

          git diff --cached --quiet || git commit -m "Update pharma intelligence"

          git push origin HEAD:v2-intelligence

name: Test News Failure Safety

on:
  push:
    branches:
      - "fix/news-collection-failure-status"
  pull_request:
    branches:
      - "v2-intelligence"

permissions:
  contents: read

jobs:
  test-news-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m py_compile news.py validate_data.py tests/test_news_failure.py tests/test_news_quality.py
      - name: Test all-feeds-failed safety
        run: python -m unittest discover -s tests -p "test_*.py" -v

name: WhatsApp Briefing Test
on:
  schedule:
    - cron: "30 1 * * *" # 07:00 Asia/Kolkata
  workflow_dispatch:
    inputs:
      confirm_send:
        description: "Type YES to send the approved short morning briefing to the configured recipient"
        required: true
        type: string
jobs:
  send-briefing:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.confirm_send == 'YES') || (github.event_name == 'schedule' && vars.WHATSAPP_AUTOMATION_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out intelligence data
        uses: actions/checkout@v4
        with:
          ref: v2-intelligence

      - name: Validate required secrets
        env:
          WA_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WA_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WA_TO: ${{ secrets.WHATSAPP_RECIPIENT_NUMBER }}
        run: |
          test -n "$WA_TOKEN" || (echo "Missing WHATSAPP_ACCESS_TOKEN" && exit 1)
          test -n "$WA_PHONE_ID" || (echo "Missing WHATSAPP_PHONE_NUMBER_ID" && exit 1)
          test -n "$WA_TO" || (echo "Missing WHATSAPP_RECIPIENT_NUMBER" && exit 1)
          test -f data.json || (echo "data.json not found on v2-intelligence" && exit 1)

      - name: Build concise daily message
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo

          with open("data.json", encoding="utf-8") as f:
              data = json.load(f)

          now = datetime.now(ZoneInfo("Asia/Kolkata"))
          quotes = [
              ("Great things are done by a series of small things brought together.", "Vincent van Gogh"),
              ("Well done is better than well said.", "Benjamin Franklin"),
              ("It always seems impossible until it's done.", "Nelson Mandela"),
              ("The secret of getting ahead is getting started.", "Mark Twain"),
              ("Quality is not an act, it is a habit.", "Aristotle"),
              ("Success is the sum of small efforts, repeated day in and day out.", "Robert Collier"),
              ("What we think, we become.", "Buddha"),
              ("The best way to predict the future is to create it.", "Peter Drucker"),
              ("Without continual growth and progress, such words as improvement, achievement, and success have no meaning.", "Benjamin Franklin"),
              ("Great things are not done by impulse, but by a series of small things brought together.", "Vincent van Gogh")
          ]
          quote, author = quotes[now.timetuple().tm_yday % len(quotes)]

          candidates = data.get("must_know", [])
          if not candidates:
              candidates = data.get("articles", [])

          def score(item):
              priority = str(item.get("priority", "")).lower()
              rank = {"critical": 4, "high": 3, "medium": 2, "low": 1}.get(priority, 0)
              return (rank, item.get("importance_score", 0), item.get("published", ""))

          candidates = sorted(candidates, key=score, reverse=True)
          highlight = None
          for item in candidates:
              title = item.get("title", "").strip()
              if title:
                  highlight = title
                  break

          lines = [
              "Good morning, Sir! 🙏",
              "",
              now.strftime("%A, %d %B %Y"),
              "",
              "Quote of the Day:",
              f"“{quote}” — {author}",
              ""
          ]

          if highlight:
              lines.extend([
                  "Today's Key Highlight:",
                  highlight,
                  ""
              ])

          lines.extend([
              "🔗 Pharma Industry Intelligence & Business Developments",
              "https://hrsriadityapharmachem-ux.github.io/pharma-md-intelligence/",
              "",
              "Wishing you a productive day ahead, Sir."
          ])

          message = "\n".join(lines)
          with open("wa-payload.json", "w", encoding="utf-8") as f:
              json.dump({
                  "messaging_product": "whatsapp",
                  "recipient_type": "individual",
                  "to": "__RECIPIENT__",
                  "type": "text",
                  "text": {"preview_url": True, "body": message}
              }, f, ensure_ascii=False)
          print(message)
          PY

      - name: Send WhatsApp briefing
        env:
          WA_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WA_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WA_TO: ${{ secrets.WHATSAPP_RECIPIENT_NUMBER }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          with open("wa-payload.json", encoding="utf-8") as f:
              payload = json.load(f)
          payload["to"] = os.environ["WA_TO"]
          with open("wa-payload.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False)
          PY
          response=$(curl --fail-with-body --silent --show-error -X POST "https://graph.facebook.com/v25.0/${WA_PHONE_ID}/messages" -H "Authorization: Bearer ${WA_TOKEN}" -H "Content-Type: application/json" --data-binary @wa-payload.json)
          echo "$response" | jq '{messaging_product, contacts, messages: [.messages[]? | {id, message_status}]}'
